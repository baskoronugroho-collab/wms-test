description: >
  Warehouse management for Ninja Van's GrabMart Kilat quick-commerce fulfilment
  (Wardah consignment pilot). Station staff receive brand deliveries by AWB in
  batches, put stock away into rack bins, pick orders and count stock from a phone
  or scanner; SPVs and Ops HQ manage hub rack layouts, stock thresholds, replenishment
  requests with variance sign-off, and automatic reminders.

database: oceanbase

services:
  object-storage: {}

