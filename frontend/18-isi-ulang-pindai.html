<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pindai di rak tujuan — Ninja Kilat WMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css?v=ee443b9">
<link rel="stylesheet" href="css/app.css?v=ee443b9">
</head>
<body>
<div class="app" data-screen="replenish-scan" data-screen-label="18b">
    <header class="chrome">
      <span class="chrome__mark">NINJA</span>
      <a class="chrome__home" href="index.html" data-id="Menu" data-en="Menu">Menu</a>
      <span class="chrome__sep"></span>
      <span class="chrome__mode" data-id="Isi ulang rak · UT5" data-en="Replenishment · UT5">Isi ulang rak · UT5</span>
      <span class="spacer"></span>
      <span class="conn" role="status">
        <span class="conn__dot"></span><span class="conn__label" data-online="Terhubung" data-offline="Tidak terhubung">Terhubung</span>
      </span>
      <span class="lang" role="group" aria-label="Bahasa">
        <button class="lang__opt is-on" data-lang="id" type="button">ID</button>
        <button class="lang__opt" data-lang="en" type="button">EN</button>
      </span>
      <button class="theme-toggle" data-action="toggle-theme" type="button" data-id="Gelap" data-en="Dark">Gelap</button>
      <span class="chrome__user">Dwi L. · UT5</span>
    </header>
    <main class="main">
      <div class="row-split">
        <div class="col col--grow">
          <div class="col">
            <span class="eyebrow" data-id="Ambil dari cadangan" data-en="Take from overflow">Ambil dari cadangan</span>
            <div class="instr">
              <span class="instr__arrow" aria-hidden="true">→</span>
              <span class="code code--lg">UT5-OV-2-04</span>
            </div>
            <span class="eyebrow" style="margin-top:8px" data-id="Lalu isi ke rak ambil" data-en="Then fill the pick face">Lalu isi ke rak ambil</span>
            <div class="instr">
              <span class="instr__arrow" aria-hidden="true">→</span>
              <span class="code code--xl">UT5-<span class="code__hl">A</span>-<span class="code__hl">3</span>-02</span>
            </div>
          </div>
          <div class="counter">
            <div class="col" style="gap:6px">
              <span class="eyebrow" data-id="Pindahkan" data-en="Move">Pindahkan</span>
              <span class="lede" data-id="Rak ambil sekarang kosong" data-en="The pick face is empty right now">Rak ambil sekarang kosong</span>
            </div>
            <span class="counter__num">24</span>
          </div>
          <div class="scanzone" data-scan-label="Pindai satu barang di rak tujuan" data-offline-msg="Tunggu koneksi kembali">
            <span class="scanzone__state" data-id="Menunggu pindaian" data-en="Waiting for scan">Menunggu pindaian</span>
            <span class="scanzone__prompt" data-id="Pindai satu barang di rak tujuan" data-en="Scan one item at the destination rack">Pindai satu barang di rak tujuan</span>
            <input class="scanzone__input" aria-label="Pindai satu barang di rak tujuan">
          </div>
          <a class="btn btn--lg btn--block" href="18-isi-ulang.html" data-id="Kembali ke daftar" data-en="Back to the list">Kembali ke daftar</a>
        </div>
        <div class="col" style="flex:0 0 380px">
          <img class="product__photo product__photo--fill" src="assets/products/placeholder.svg" data-photo-key="wdh-gll-07" alt="Glasting Liquid Lip 07 Rouge Flare">
          <div class="col" style="gap:6px">
            <span class="product__meta">Wardah · 3,5 g · WDH-GLL-07</span>
            <span class="product__name">Glasting Liquid Lip <span class="product__shade">07</span> Rouge Flare</span>
          </div>
        </div>
      </div>
    </main>
</div>
<script src="js/api.js?v=ee443b9"></script>
<script src="js/scan.js?v=ee443b9"></script>
<script src="js/app.js?v=ee443b9"></script>
<script src="js/wire.js?v=ee443b9"></script>

</body>
</html>
