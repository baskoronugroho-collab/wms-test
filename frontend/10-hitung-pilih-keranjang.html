<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hitung stok — pilih keranjang — Ninja Kilat WMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css?v=8807087">
<link rel="stylesheet" href="css/app.css?v=8807087">
</head>
<body>
<div class="app" data-screen="count-list">
    <header class="chrome">
      <span class="chrome__mark">NINJA</span>
      <a class="chrome__home" href="index.html" data-id="Menu" data-en="Menu">Menu</a>
      <span class="chrome__sep"></span>
      <span class="chrome__mode" data-id="Hitung stok" data-en="Stock count">Hitung stok</span>
      <span class="spacer"></span>
      <span class="conn" role="status">
        <span class="conn__dot"></span><span class="conn__label" data-online="Terhubung" data-offline="Tidak terhubung">Terhubung</span>
      </span>
      <span class="lang" role="group" aria-label="Bahasa">
        <button class="lang__opt is-on" data-lang="id" type="button">ID</button>
        <button class="lang__opt" data-lang="en" type="button">EN</button>
      </span>
      <button class="theme-toggle" data-action="toggle-theme" type="button" data-id="Gelap" data-en="Dark">Gelap</button>
      <span class="chrome__user">Siti N. · UT5</span>
    </header>
    <main class="main main--tight">
      <div class="row-split" style="flex:0 0 auto;align-items:flex-end">
        <div class="col" style="gap:6px;flex:1 1 auto">
          <span class="eyebrow" data-id="Urut sesuai jalan kaki" data-en="In walking order">Urut sesuai jalan kaki</span>
          <h1 class="h1" data-id="Pilih keranjang untuk dihitung" data-en="Choose a basket to count">Pilih keranjang untuk dihitung</h1>
        </div>
        <span class="progress__count"></span>
      </div>
      <!-- Rows are rendered from GET /api/opname/plans/{id} by js/screens/count-list.js,
           one variant per state: next, to count, yours in progress, locked, done. -->
      <div class="list" data-region="baskets">
        <p class="note" data-id="Memuat keranjang…" data-en="Loading baskets…">Memuat keranjang…</p>
      </div>
    </main>
</div>
<script src="js/api.js?v=8807087"></script>
<script src="js/scan.js?v=8807087"></script>
<script src="js/app.js?v=8807087"></script>
<script src="js/wire.js?v=8807087"></script>
<script src="js/screens/count-list.js?v=8807087"></script>

</body>
</html>
