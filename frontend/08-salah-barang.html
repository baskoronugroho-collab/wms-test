<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salah barang — Ninja Kilat WMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" data-screen="wrong-item">

    <main class="app" style="background:var(--stop);min-height:100vh;gap:0">
      <div class="banner" style="min-height:auto;padding:26px 40px;color:var(--stop-ink)" role="alert">
        <span class="banner__icon banner__icon--round" style="width:56px;height:56px;font-size:32px;border-width:4px" aria-hidden="true">×</span>
        <div class="col" style="gap:2px">
          <span class="eyebrow" style="color:rgba(255,255,255,.8);letter-spacing:.24em" data-id="Berhenti" data-en="Stop">Berhenti</span>
          <span style="font-size:44px;font-weight:600;line-height:1.05" data-id="Salah barang" data-en="Wrong item">Salah barang</span>
        </div>
      </div>
      <div class="compare">
        <div class="card-compare card-compare--wrong">
          <span class="eyebrow" style="color:var(--stop)" data-id="Yang kamu pindai" data-en="What you scanned">Yang kamu pindai</span>
          <img class="card-compare__photo" src="assets/products/wdh-gll-08.jpg" alt="Glasting Liquid Lip 08 Coral Dust" onerror="this.src='assets/products/placeholder.svg'">
          <span class="product__name">Glasting Liquid Lip <span class="product__shade" style="color:var(--stop);font-size:32px">08</span> Coral Dust</span>
          <span class="code code--sm" style="color:var(--muted)">3,5 g · WDH-GLL-08</span>
        </div>
        <div class="compare__vs" aria-hidden="true">≠</div>
        <div class="card-compare card-compare--right">
          <span class="eyebrow" style="color:var(--accept)" data-id="Yang diminta pesanan" data-en="What the order wants">Yang diminta pesanan</span>
          <img class="card-compare__photo" src="assets/products/wdh-gll-07.jpg" alt="Glasting Liquid Lip 07 Rouge Flare" onerror="this.src='assets/products/placeholder.svg'">
          <span class="product__name">Glasting Liquid Lip <span class="product__shade" style="color:var(--accept);font-size:32px">07</span> Rouge Flare</span>
          <span class="code code--sm" style="color:var(--muted)">3,5 g · WDH-GLL-07</span>
        </div>
      </div>
      <div class="col" style="padding:26px 40px;gap:18px">
        <p style="font-size:30px;font-weight:600;color:var(--stop-ink);line-height:1.3;margin:0;text-wrap:pretty" data-id="Kembalikan yang 08 ke keranjangnya, lalu ambil 07 dari keranjang yang sama — UT5-A-3-02." data-en="Put the 08 back in its basket, then take 07 from the same basket — UT5-A-3-02.">Kembalikan yang 08 ke keranjangnya, lalu ambil 07 dari keranjang yang sama — UT5-A-3-02.</p>
        <div class="stats">
          <a class="btn btn--onstop btn--lg btn--grow" href="07-ambil-pesanan.html" data-id="Pindai ulang barang yang benar" data-en="Scan the right item again">Pindai ulang barang yang benar</a>
          <a class="btn btn--lg btn--onstop-outline" href="index.html" style="flex:0 0 220px" data-id="Menu" data-en="Menu">Menu</a>
        </div>
      </div>
    </main>
</div>
<script src="js/scan.js"></script>
<script src="js/app.js"></script>
<script src="js/wire.js"></script>

</body>
</html>
