<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buat keranjang baru — Ninja Kilat WMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" data-screen="create-basket">
    <header class="chrome">
      <span class="chrome__mark">NINJA</span>
      <a class="chrome__home" href="index.html" data-id="Menu" data-en="Menu">Menu</a>
      <span class="chrome__sep"></span>
      <span class="chrome__mode" data-id="Barang masuk · keranjang baru" data-en="Inbound · new basket">Barang masuk · keranjang baru</span>
      <span class="spacer"></span>
      <span class="conn" role="status">
        <span class="conn__dot"></span><span class="conn__label" data-online="Terhubung" data-offline="Tidak terhubung">Terhubung</span>
      </span>
      <span class="lang" role="group" aria-label="Bahasa">
        <button class="lang__opt is-on" data-lang="id" type="button">ID</button>
        <button class="lang__opt" data-lang="en" type="button">EN</button>
      </span>
      <button class="theme-toggle" data-action="toggle-theme" type="button" data-id="Gelap" data-en="Dark">Gelap</button>
      <span class="chrome__user">Rina P. · UT5</span>
    </header>
    <main class="main main--tight">
      <div class="col" style="gap:6px">
        <span class="eyebrow" data-id="Barang ini belum punya keranjang" data-en="This product has no basket yet">Barang ini belum punya keranjang</span>
        <h1 class="h1" data-id="Buat keranjang baru — 2 ketukan" data-en="Create a basket — two taps">Buat keranjang baru — 2 ketukan</h1>
      </div>
      <div class="panel" style="padding:20px">
        <div class="product">
          <img class="product__photo" src="assets/products/wdh-uvs-030.jpg" alt="UV Shield Airy Smooth Sunscreen SPF 50" onerror="this.src='assets/products/placeholder.svg'">
          <div class="col" style="gap:8px">
            <span class="product__meta">Wardah · 30 ml · WDH-UVS-030</span>
            <span class="product__name">UV Shield Airy Smooth Sunscreen SPF 50 PA+++</span>
          </div>
        </div>
      </div>
      <div class="row-split">
        <div class="col" style="flex:0 0 420px">
          <span class="eyebrow" data-id="1 — Ukuran keranjang" data-en="1 — Basket size">1 — Ukuran keranjang</span>
          <button class="option" type="button"><span data-id="Kecil" data-en="Small">Kecil</span><span class="option__hint" data-id="sampai 20 barang" data-en="up to 20 items">sampai 20 barang</span></button>
          <button class="option is-on" type="button" aria-pressed="true"><span data-id="Sedang" data-en="Medium">Sedang</span><span class="option__hint" data-id="sampai 40 barang" data-en="up to 40 items">sampai 40 barang</span></button>
          <button class="option" type="button"><span data-id="Besar" data-en="Large">Besar</span><span class="option__hint" data-id="sampai 80 barang" data-en="up to 80 items">sampai 80 barang</span></button>
        </div>
        <div class="col col--grow">
          <span class="eyebrow" data-id="2 — Lokasi kosong terdekat" data-en="2 — Nearest empty locations">2 — Lokasi kosong terdekat</span>
          <div class="stats">
            <button class="loc-option is-on" type="button" aria-pressed="true"><span class="eyebrow eyebrow--action" data-id="Disarankan" data-en="Suggested">Disarankan</span><span class="code code--md">UT5-C-5-04</span><span class="note" style="color:inherit" data-id="Dekat produk sejenis" data-en="Next to similar products">Dekat produk sejenis</span></button>
            <button class="loc-option" type="button"><span class="eyebrow" data-id="Pilihan lain" data-en="Alternative">Pilihan lain</span><span class="code code--md">UT5-D-2-01</span><span class="note" data-id="Rak D, tingkat 2" data-en="Rack D, level 2">Rak D, tingkat 2</span></button>
            <button class="loc-option" type="button"><span class="eyebrow" data-id="Pilihan lain" data-en="Alternative">Pilihan lain</span><span class="code code--md">UT5-G-1-03</span><span class="note" data-id="Rak G, tingkat 1" data-en="Rack G, level 1">Rak G, tingkat 1</span></button>
          </div>
          <span class="spacer"></span>
          <div class="stats">
            <a class="btn btn--lg" href="02-barang-masuk-scan.html" style="flex:0 0 220px" data-id="Kembali" data-en="Back">Kembali</a>
            <a class="btn btn--primary btn--lg btn--grow" href="02-barang-masuk-scan.html" data-id="Buat keranjang di UT5-C-5-04 & lanjut" data-en="Create basket at UT5-C-5-04 & continue">Buat keranjang di UT5-C-5-04 &amp; lanjut</a>
          </div>
        </div>
      </div>
    </main>
</div>
<script src="js/scan.js"></script>
<script src="js/app.js"></script>
<script src="js/wire.js"></script>
</body>
</html>
