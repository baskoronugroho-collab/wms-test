# Serves the static app. /api is routed to the backend by the Ingress, so it
# never reaches nginx.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The app is one HTML file plus css/js; never let a stale shell stick around.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
