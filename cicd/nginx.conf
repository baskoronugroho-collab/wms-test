# Serves the static app. /api is routed to the backend by the Ingress, so it
# never reaches nginx.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This is a MULTI-PAGE app — 16 station screens and 14 console screens, each
    # a real file — not a single-page app. A mistyped or dead link must 404 so
    # it is visible, rather than silently rendering the home screen to a staffer
    # who believes they are somewhere else. It also stops a missing file after a
    # bad deploy from masquerading as a working page with a 200.
    location / {
        try_files $uri $uri/ =404;
    }

    # There is no build step, so assets are served under stable names with no
    # content hash: index.html can update while a browser keeps yesterday's
    # app.css forever, which renders new markup against an old stylesheet. That
    # is not hypothetical — it happened on the v2 rollout.
    #
    # no-cache does NOT mean "don't cache": the browser still stores the file
    # and revalidates with its ETag, so an unchanged asset costs a 304 and no
    # body. Correctness on a shared station device is worth that round trip.
    location ~* \.(html|css|js|json)$ {
        add_header Cache-Control "no-cache";
    }

    # Images and fonts are content-stable and expensive; let them cache properly.
    location ~* \.(png|jpe?g|svg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
    }
}
